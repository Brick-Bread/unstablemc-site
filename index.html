<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UnstableMC — Coming soon</title>
<meta name="description" content="UnstableMC. Coming soon.">
<meta name="theme-color" content="#181818">
<meta property="og:title" content="UnstableMC — Coming soon">
<meta property="og:description" content="UnstableMC. Coming soon.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://unstablemc.gg/">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #181818; color: #bdbdbd; font-family: Arial, Helvetica, sans-serif; }
main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }
img { display: block; width: min(560px, 100%); height: auto; }
h1 { margin: 32px 0 0; font-size: 16px; font-weight: normal; line-height: 1.5; }

.logo { width: min(560px, 100%); }
.logo img { width: 100%; }
h1 span { display: inline-block; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 calc(90px + var(--charge, 0) * 180px) calc(12px + var(--charge, 0) * 90px) rgb(166 0 230 / calc(.12 + var(--charge, 0) * .73)); }
.logo, h1 { touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.logo img { -webkit-user-drag: none; }
@media (pointer: coarse) {
  .logo { width: min(560px, 90%); }
  h1 { padding: 12px; margin-top: 20px; }
}
</style>
</head>
<body>
<main>
<div class="logo"><img src="logo.svg?v=2" alt="UnstableMC" draggable="false" width="1024" height="314"></div>
<h1><span>Coming soon.</span></h1>
</main>
<script>
const motionAllowed = matchMedia('(prefers-reduced-motion: no-preference)');
function bindInteraction(area, start, stop) {
  let pointer = null, active = false;
  const begin = () => { if (!active) { active = true; start(); } };
  const end = () => { if (active) { active = false; stop(); } };
  area.addEventListener('pointerenter', event => {
    if (event.pointerType === 'mouse') begin();
  });
  area.addEventListener('pointerleave', event => {
    if (event.pointerType === 'mouse') end();
  });
  area.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse' || pointer !== null || !event.isPrimary) return;
    pointer = event.pointerId;
    area.setPointerCapture(pointer);
    begin();
  });
  const release = event => {
    if (event.pointerId !== pointer) return;
    pointer = null;
    end();
  };
  area.addEventListener('pointerup', release);
  area.addEventListener('pointercancel', release);
  area.addEventListener('lostpointercapture', release);
  area.addEventListener('contextmenu', event => event.preventDefault());
  window.addEventListener('blur', () => { pointer = null; end(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { pointer = null; end(); }
  });
  return { isActive: () => active };
}
for (const [area, target] of [
  
  [document.querySelector('h1'), document.querySelector('h1 span')]
]) {
  let animation;
  const currentTransform = () => getComputedStyle(target).transform;
  function play(frames, duration) {
    animation?.cancel();
    const next = target.animate(frames, {
      duration, easing: 'linear', fill: 'forwards'
    });
    animation = next;
    next.onfinish = () => {
      if (animation === next) {
        next.cancel();
        animation = null;
      }
    };
  }
  bindInteraction(area, () => {
    if (!motionAllowed.matches) return;
    const start = currentTransform();
    const poses = [
      [0, start], [.07, 'scale(1.05) rotate(-1.5deg)'],
      [.16, 'scale(1.045) rotate(1.3deg)'],
      [.28, 'scale(1.035) rotate(-1deg)'],
      [.44, 'scale(1.025) rotate(.7deg)'],
      [.64, 'scale(1.012) rotate(-.35deg)'],
      [.84, 'scale(1.004) rotate(.12deg)'],
      [1, 'scale(1) rotate(0deg)']
    ];
    play(poses.map(([offset, transform]) => ({
      offset, transform, easing: 'ease-in-out'
    })), 2600);
  }, () => {
    if (!animation) return;
    const start = currentTransform();
    play([
      {transform: start, easing: 'cubic-bezier(.2,.7,.2,1)'},
      {transform: 'scale(1) rotate(0deg)'}
    ], 320);
  });
  motionAllowed.addEventListener('change', () => {
    if (!motionAllowed.matches) {
      animation?.cancel();
      animation = null;
    }
  });
}

const logo = document.querySelector('.logo');
const picture = logo.querySelector('img');
let frame, started, settling, bursting = false, locked = false, charge = 0;
let particles = [];
function settle() {
  cancelAnimationFrame(frame);
  const transform = getComputedStyle(picture).transform;
  const filter = getComputedStyle(picture).filter;
  settling?.cancel();
  picture.style.transform = '';
  picture.style.filter = '';
  settling = picture.animate([
    { transform, filter }, { transform: 'none', filter: 'none' }
  ], { duration: 400, easing: 'ease-out' });
  const from = charge, time = performance.now();
  function fade(now) {
    charge = from * Math.pow(1 - Math.min((now - time) / 400, 1), 2);
    document.body.style.setProperty('--charge', charge);
    if (now - time < 400) frame = requestAnimationFrame(fade);
  }
  frame = requestAnimationFrame(fade);
}
function explode() {
  bursting = true;
  locked = true;
  const box = logo.getBoundingClientRect();
  picture.style.visibility = 'hidden';
  const layer = document.createElement('div');
  layer.style.cssText = 'position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:10';
  document.body.append(layer);
  particles.push(layer);
  const flights = [];
  for (let row = 0; row < 3; row++) for (let col = 0; col < 8; col++) {
    const bit = document.createElement('div');
    const w = box.width / 8, h = box.height / 3;
    bit.style.cssText = `position:absolute;left:${box.left + col*w}px;top:${box.top + row*h}px;width:${w + .5}px;height:${h + .5}px;background-image:url("logo.svg?v=2");background-size:${box.width}px ${box.height}px;background-position:${-col*w}px ${-row*h}px`;
    layer.append(bit);
    const dx = (col - 3.5) * 65, dy = (row - 1) * 140 - 40;
    flights.push(bit.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) rotate(${(col-row)*19}deg) scale(.2)`, opacity: 0 }
    ], { duration: 700, easing: 'cubic-bezier(.1,.6,.3,1)', fill: 'forwards' }).finished.catch(() => {}));
  }
  settle();
  Promise.all(flights).then(() => {
    layer.remove();
    particles = particles.filter(item => item !== layer);
    picture.style.visibility = '';
    if (motionAllowed.matches) picture.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 350 });
    bursting = false;
    if (!logoInput.isActive()) locked = false;
  });
}
const logoInput = bindInteraction(logo, () => {
  if (!motionAllowed.matches || bursting || locked) return;
  cancelAnimationFrame(frame);
  settling?.cancel();
  const initial = charge;
  started = performance.now() - initial * 5000;
  function build(now) {
    charge = Math.min((now - started) / 5000, 1);
    document.body.style.setProperty('--charge', charge);
    const wave = Math.sin((now - started) / 85);
    picture.style.transform = `scale(${1 + charge * .18}) rotate(${wave * charge * 5}deg)`;
    picture.style.filter = `drop-shadow(0 0 ${charge * 35}px rgba(190,0,255,${charge * .8}))`;
    if (charge === 1) explode();
    else frame = requestAnimationFrame(build);
  }
  frame = requestAnimationFrame(build);
}, () => {
  if (!bursting) { locked = false; settle(); }
});
motionAllowed.addEventListener('change', () => {
  if (!motionAllowed.matches) {
    cancelAnimationFrame(frame);
    settling?.cancel();
    particles.forEach(item => item.remove());
    particles = [];
    picture.style.transform = '';
    picture.style.filter = '';
    picture.style.visibility = '';
    charge = 0;
    document.body.style.setProperty('--charge', 0);
    locked = false;
  }
});
</script>
</body>
</html>
