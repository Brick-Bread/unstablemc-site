<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UnstableMC — Coming soon</title>
<meta name="description" content="UnstableMC. Coming soon.">
<meta name="theme-color" content="#181818">
<meta property="og:title" content="UnstableMC — Coming soon">
<meta property="og:description" content="UnstableMC. Coming soon.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://unstablemc.gg/">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #181818; color: #bdbdbd; font-family: Arial, Helvetica, sans-serif; }
main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }
img { display: block; width: min(560px, 100%); height: auto; }
h1 { margin: 32px 0 0; font-size: 16px; font-weight: normal; line-height: 1.5; }

.logo { width: min(560px, 100%); }
.logo img { width: 100%; }
h1 span { display: inline-block; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px 12px rgb(166 0 230 / 12%); }
</style>
</head>
<body>
<main>
<div class="logo"><img src="logo.svg?v=2" alt="UnstableMC" width="1024" height="314"></div>
<h1><span>Coming soon.</span></h1>
</main>
<script>
const motionAllowed = matchMedia('(hover: hover) and (prefers-reduced-motion: no-preference)');
for (const [area, target] of [
  [document.querySelector('.logo'), document.querySelector('.logo img')],
  [document.querySelector('h1'), document.querySelector('h1 span')]
]) {
  let animation;
  const currentTransform = () => getComputedStyle(target).transform;
  function play(frames, duration) {
    animation?.cancel();
    const next = target.animate(frames, {
      duration, easing: 'linear', fill: 'forwards'
    });
    animation = next;
    next.onfinish = () => {
      if (animation === next) {
        next.cancel();
        animation = null;
      }
    };
  }
  area.addEventListener('pointerenter', () => {
    if (!motionAllowed.matches) return;
    const start = currentTransform();
    const poses = [
      [0, start], [.07, 'scale(1.05) rotate(-1.5deg)'],
      [.16, 'scale(1.045) rotate(1.3deg)'],
      [.28, 'scale(1.035) rotate(-1deg)'],
      [.44, 'scale(1.025) rotate(.7deg)'],
      [.64, 'scale(1.012) rotate(-.35deg)'],
      [.84, 'scale(1.004) rotate(.12deg)'],
      [1, 'scale(1) rotate(0deg)']
    ];
    play(poses.map(([offset, transform]) => ({
      offset, transform, easing: 'ease-in-out'
    })), 2600);
  });
  area.addEventListener('pointerleave', () => {
    if (!animation) return;
    const start = currentTransform();
    play([
      {transform: start, easing: 'cubic-bezier(.2,.7,.2,1)'},
      {transform: 'scale(1) rotate(0deg)'}
    ], 320);
  });
  motionAllowed.addEventListener('change', () => {
    if (!motionAllowed.matches) {
      animation?.cancel();
      animation = null;
    }
  });
}
</script>
</body>
</html>
