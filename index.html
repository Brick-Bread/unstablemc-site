<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UnstableMC — Server launching soon</title>
<meta name="description" content="UnstableMC. A Minecraft server, currently in the works. Launching soon.">
<meta name="theme-color" content="#141414">
<meta property="og:title" content="UnstableMC — Server launching soon">
<meta property="og:description" content="A Minecraft server. Currently in the works.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://unstablemc.gg/">
<style>
:root{color-scheme:dark;--paper:#eae8e1;--ink:#141414;--muted:#a6a49e;--line:#41413e;--pink:#ed32ef}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1440px;margin:auto;padding:28px 5vw 22px;min-height:100svh;display:flex;flex-direction:column}
.masthead{display:flex;justify-content:space-between;gap:24px;padding-bottom:18px;border-bottom:1px solid var(--line);font-family:"Courier New",monospace;font-size:12px;font-weight:bold;line-height:1.5;letter-spacing:.07em;text-transform:uppercase}
.masthead span:first-child::before{content:"";display:inline-block;width:8px;height:8px;background:var(--pink);margin-right:12px}
.masthead span:last-child{color:var(--muted)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:48px 0 60px}
.brand{width:min(660px,74%);margin:0 0 48px;align-self:center}
.brand img{display:block;width:100%;height:auto}
.announcement{display:grid;grid-template-columns:minmax(0,1fr) 240px;column-gap:5vw;align-items:end}
h1{font-family:Impact,"Arial Narrow","Helvetica Neue",sans-serif;font-size:clamp(76px,10.3vw,148px);font-weight:900;line-height:.89;letter-spacing:-.025em;text-transform:uppercase;margin:0}
h1 span{display:block}
h1 .soon{color:var(--pink)}
.note{padding:0 0 5px 20px;border-left:2px solid var(--pink)}
.note p{font-size:17px;line-height:1.55;margin:0}
.note p+p{margin-top:14px;font-size:14px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-family:"Courier New",monospace;font-size:11px;line-height:1.5;letter-spacing:.055em;text-transform:uppercase}
footer strong{font-weight:normal;color:var(--paper)}
@media(min-width:1500px){.page{padding-left:72px;padding-right:72px}}
@media(max-width:700px){
.page{padding:22px 24px 20px}
.masthead{font-size:10px;gap:12px;padding-bottom:15px}
main{padding:52px 0 44px}
.brand{width:100%;max-width:480px;margin-bottom:52px}
.announcement{grid-template-columns:1fr;gap:30px}
h1{font-size:clamp(64px,15vw,105px)}
.note{max-width:330px;padding-left:15px}
.note p{font-size:16px}
.note p+p{font-size:13px;margin-top:8px}
footer{font-size:10px}
}
@media(prefers-reduced-motion:no-preference){::selection{background:var(--pink);color:var(--ink)}}
</style>
</head>
<body>
<div class="page">
<header class="masthead"><span>UnstableMC</span><span>Minecraft / In development</span></header>
<main>
<div class="brand"><img src="logo.svg?v=2" alt="UnstableMC" width="1024" height="314"></div>
<div class="announcement">
<h1><span>Launching</span><span class="soon">soon.</span></h1>
<div class="note"><p>A Minecraft server.<br>Currently in the works.</p><p>Launch date to be announced.</p></div>
</div>
</main>
<footer><strong>unstablemc.gg</strong><span>See you in-game.</span></footer>
</div>
</body>
</html>
