<style>
* { box-sizing: border-box; }
body { margin: 0; background: #181818; color: #bdbdbd; font-family: Arial, Helvetica, sans-serif; }
main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }
img { display: block; width: min(560px, 100%); height: auto; }
h1 { margin: 32px 0 0; font-size: 16px; font-weight: normal; line-height: 1.5; }

.logo { width: min(560px, 100%); }
.logo img { width: 100%; }
h1 span { display: inline-block; }
@keyframes wiggle {
  0%   { transform: scale(1) rotate(0deg); }
  7%   { transform: scale(1.05) rotate(-1.5deg); }
  16%  { transform: scale(1.045) rotate(1.3deg); }
  28%  { transform: scale(1.035) rotate(-1deg); }
  44%  { transform: scale(1.025) rotate(.7deg); }
  64%  { transform: scale(1.012) rotate(-.35deg); }
  84%  { transform: scale(1.004) rotate(.12deg); }
  100% { transform: scale(1) rotate(0deg); }
}
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .logo:hover img, h1:hover span {
    animation: wiggle 2.6s ease-in-out both;
  }
}
</style>
</head>

<main>
